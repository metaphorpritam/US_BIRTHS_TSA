[project]
name = "isi-tsa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.3.0",
    "duckdb>=1.4.1",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.10",
    "matplotlib>=3.10.7",
    "notebook>=7.4.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "polars>=1.34.0",
    "prophet>=1.2.1",
    "pytrends>=4.9.2",
    "pywavelets>=1.9.0",
    "scipy>=1.16.2",
    "scipy-stubs[scipy]>=1.16.2.4",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
    "tbats",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pandas-stubs>=2.3.2.250926",
    "types-seaborn>=0.13.2.20250914",
    "types-tqdm>=4.67.0.20250809",
]

[[tool.mypy.overrides]]
module = "statsmodels.*"
ignore_missing_imports = true

[tool.uv.extra-build-dependencies]
      pmdarima = ["numpy"]
      tbats = ["numpy"]
